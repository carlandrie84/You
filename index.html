<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050817">
<title>Good Night 🌙</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,"Segoe UI",sans-serif;
    color:white;
    background:
        radial-gradient(
            circle at 50% 28%,
            #304b8a 0%,
            #172858 30%,
            #0a1331 65%,
            #02040d 100%
        );
}

/* =========================
   STAR FIELD
========================= */

#stars{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
}

.star{
    position:absolute;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px #fff;
    animation:twinkle var(--time) infinite ease-in-out;
    animation-delay:var(--delay);
}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.6);
    }
    50%{
        opacity:1;
        transform:scale(1.5);
    }
}

/* =========================
   SHOOTING STARS
========================= */

.shooting-star{
    position:fixed;
    width:2px;
    height:2px;
    background:white;
    box-shadow:
        0 0 6px white,
        0 0 15px white;
    transform:rotate(-35deg);
    z-index:2;
    opacity:0;
    animation:shoot 6s linear infinite;
}

.shooting-star::after{
    content:"";
    position:absolute;
    right:0;
    top:0;
    width:100px;
    height:2px;
    background:linear-gradient(
        90deg,
        rgba(255,255,255,.8),
        transparent
    );
}

@keyframes shoot{
    0%{
        opacity:0;
        transform:translate(0,0) rotate(-35deg);
    }

    8%{
        opacity:1;
    }

    20%{
        opacity:0;
        transform:translate(-250px,180px) rotate(-35deg);
    }

    100%{
        opacity:0;
    }
}

/* =========================
   MOON
========================= */

.moon{
    position:fixed;
    top:9%;
    right:10%;
    width:120px;
    height:120px;
    border-radius:50%;
    background:#fffde9;
    z-index:3;

    box-shadow:
        0 0 20px rgba(255,255,255,.9),
        0 0 50px rgba(255,255,220,.65),
        0 0 100px rgba(255,255,220,.3);

    animation:moonFloat 5s ease-in-out infinite;
}

.moon:after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    left:-15px;
    top:-8px;
    border-radius:50%;
    background:#172858;
}

@keyframes moonFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

/* =========================
   CLOUDS
========================= */

.cloud{
    position:fixed;
    z-index:2;
    width:220px;
    height:55px;
    border-radius:100px;
    background:rgba(255,255,255,.035);
    filter:blur(2px);
    animation:cloudMove 35s linear infinite;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.035);
}

.cloud:before{
    width:90px;
    height:90px;
    left:35px;
    bottom:5px;
}

.cloud:after{
    width:120px;
    height:120px;
    right:30px;
    bottom:0;
}

.cloud.one{
    top:27%;
    left:-250px;
}

.cloud.two{
    top:48%;
    left:-300px;
    transform:scale(.7);
    animation-delay:12s;
}

@keyframes cloudMove{
    from{
        left:-300px;
    }

    to{
        left:110%;
    }
}

/* =========================
   MAIN CONTENT
========================= */

.container{
    position:relative;
    z-index:10;
    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    animation:contentIn 2s ease forwards;
}

@keyframes contentIn{
    from{
        opacity:0;
        transform:translateY(35px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}
