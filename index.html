<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Night 🌙</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", sans-serif;
}

body {
    background:
        radial-gradient(circle at 50% 25%, #283b72 0%, #101a3d 35%, #050817 75%, #02030b 100%);
    color: white;
}

/* ---------- OPENING SCREEN ---------- */

.opening {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #02030b;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: openingFade 2.5s ease forwards;
    animation-delay: 1.2s;
}

.opening-text {
    text-align: center;
    animation: openingText 1.8s ease forwards;
}

.opening-text h1 {
    font-size: clamp(3rem, 12vw, 7rem);
    letter-spacing: 8px;
    font-weight: 300;
    text-shadow: 0 0 25px rgba(255,255,255,.8);
}

.opening-text p {
    margin-top: 15px;
    font-size: 1rem;
    letter-spacing: 5px;
    opacity: .7;
}

/* ---------- STARS ---------- */

.stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
    animation: twinkle var(--duration) ease-in-out infinite;
    animation-delay: var(--delay);
}

/* ---------- MOON ---------- */

.moon {
    position: absolute;
    top: 12%;
    right: 13%;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: #fffdf0;
    box-shadow:
        0 0 20px #fff,
        0 0 60px rgba(255,255,220,.7),
        0 0 120px rgba(255,255,220,.3);
    animation: moonFloat 5s ease-in-out infinite;
}

.moon::after {
    content: "";
    position: absolute;
    top: -8px;
    left: -13px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: #111b40;
}

/* ---------- MAIN CONTENT ---------- */

.container {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
}

.card {
    width: min(90%, 700px);
    padding: 50px 30px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 30px;
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(12px);
    box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 0 30px rgba(255,255,255,.03);
    animation: cardAppear 2s ease forwards;
}

.moon-icon {
    font-size: 3.5rem;
    margin-bottom: 20px;
    animation: iconFloat 3s ease-in-out infinite;
}

h2 {
    font-size: clamp(2.8rem, 10vw, 5.5rem);
    font-weight: 300;
    letter-spacing: 5px;
    margin-bottom: 20px;
    text-shadow:
        0 0 10px rgba(255,255,255,.7),
        0 0 30px rgba(160,180,255,.5);
}

.message {
    font-size: clamp(1rem, 3vw, 1.25rem);
    line-height: 1.9;
    color: rgba(255,255,255,.82);
    max-width: 550px;
    margin: auto;
}

.line {
    width: 90px;
    height: 1px;
    margin: 28px auto;
    background: rgba(255,255,255,.5);
    box-shadow: 0 0 10px white;
}

.sleep {
    margin-top: 25px;
    font-size: .9rem;
    letter-spacing: 4px;
    opacity: .55;
}

/* ---------- FLOATING PARTICLES ---------- */

.particle {
    position: absolute;
    bottom: -30px;
    font-size: 18px;
    opacity: .4;
    animation: rise linear infinite;
}

/* ---------- ANIMATIONS ---------- */

@keyframes openingFade {
    0% {
        opacity: 1;
        visibility: visible;
    }

    100% {
        opacity: 0;
        visibility: hidden;
    }
}

@keyframes openingText {
    0% {
        opacity: 0;
        transform: scale(.8);
        letter-spacing: 20px;
    }

    50% {
        opacity: 1;
        transform: scale(1);
        letter-spacing: 8px;
    }

    100% {
        opacity: 0;
        transform: scale(1.1);
    }
}

@keyframes twinkle {
    0%, 100% {
        opacity: .2;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}

@keyframes moonFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(40px) scale(.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes iconFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}

@keyframes rise {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
