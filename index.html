<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050817">

<title>Good Night 🌙</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, "Segoe UI", sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 50% 25%,
            #304b8a 0%,
            #172858 30%,
            #0a1331 65%,
            #02040d 100%
        );
}


/* =========================
   STARS
========================= */

#stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
}

.star {
    position: absolute;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white;

    animation:
        twinkle var(--time)
        infinite ease-in-out;

    animation-delay: var(--delay);
}

@keyframes twinkle {

    0%,
    100% {
        opacity: .15;
        transform: scale(.6);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}


/* =========================
   SHOOTING STARS
========================= */

.shooting-star {
    position: fixed;

    width: 3px;
    height: 3px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 6px white,
        0 0 15px white;

    z-index: 3;

    opacity: 0;

    animation:
        shooting 7s linear infinite;
}

.shooting-star::after {
    content: "";

    position: absolute;

    width: 120px;
    height: 2px;

    right: 0;
    top: 1px;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.8),
            transparent
        );
}

@keyframes shooting {

    0% {
        opacity: 0;
        transform:
            translate(0, 0)
            rotate(-35deg);
    }

    8% {
        opacity: 1;
    }

    20% {
        opacity: 0;

        transform:
            translate(-260px, 180px)
            rotate(-35deg);
    }

    100% {
        opacity: 0;
    }
}


/* =========================
   MOON
========================= */

.moon {
    position: fixed;

    top: 8%;
    right: 10%;

    width: 125px;
    height: 125px;

    border-radius: 50%;

    background: #fffde9;

    z-index: 4;

    box-shadow:
        0 0 20px rgba(255,255,255,.95),
        0 0 55px rgba(255,255,220,.7),
        0 0 110px rgba(255,255,220,.3);

    animation:
        moonFloat 5s ease-in-out infinite;
}

.moon::after {
    content: "";

    position: absolute;

    width: 125px;
    height: 125px;

    left: -15px;
    top: -8px;

    border-radius: 50%;

    background: #172858;
}

@keyframes moonFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}


/* =========================
   CLOUDS
========================= */

.cloud {
    position: fixed;

    width: 220px;
    height: 55px;

    border-radius: 100px;

    background:
        rgba(255,255,255,.035);

    filter: blur(2px);

    z-index: 2;

    animation:
        cloudMove 40s linear infinite;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    border-radius: 50%;

    background:
        rgba(255,255,255,.035);
}

.cloud::before {
    width: 90px;
    height: 90px;

    left: 35px;
    bottom: 5px;
}

.cloud::after {
    width: 120px;
    height: 120px;

    right: 30px;
    bottom: 0;
}

.cloud.one {
    top: 28%;
    left: -300px;
}

.cloud.two {
    top: 50%;
    left: -350px;

    transform: scale(.7);

    animation-delay: 12s;
}

@keyframes cloudMove {

    from {
        left: -350px;
    }

    to {
        left: 110%;
    }
}


/* =========================
   MAIN CONTAINER
========================= */

.container {
    position: relative;

    z-index: 10;

    width: 100%;
    height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 25px;

    animation:
        contentAppear 2s ease forwards;
}

@keyframes contentAppear {

    from {
        opacity: 0;

        transform:
            translateY(40px)
            scale(.96);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   GLASS CARD
========================= */

.card {

    width: min(92%, 680px);

    padding: 50px 30px;

    text-align: center;

    border-radius: 30px;

    border:
        1px solid
        rgba(255,255,255,.16);

    background:
        rgba(255,255,255,.07);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    box-shadow:

        0 30px 100px
        rgba(0,0,0,.5),

        inset 0 0 35px
        rgba(255,255,255,.025);
}


/* =========================
   MOON ICON
========================= */

.moon-icon {

    font-size: 60px;

    margin-bottom: 15px;

    filter:
        drop-shadow(
            0 0 15px
            rgba(255,255,255,.8)
        );

    animation:
        iconFloat 3s ease-in-out infinite;
}

@keyframes iconFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}


/* =========================
   TITLE
========================= */

.title {

    font-size:
        clamp(45px, 12vw, 88px);

    font-weight: 300;

    letter-spacing: 4px;

    text-shadow:

        0 0 10px
        rgba(255,255,255,.9),

        0 0 30px
        rgba(150,180,255,.8),

        0 0 60px
        rgba(100,130,255,.4);
}


/* =========================
   DIVIDER
========================= */

.divider {

    width: 100px;
    height: 1px;

    margin: 28px auto;

    background:
        rgba(255,255,255,.7);

    box-shadow:
        0 0 12px white;
}


/* =========================
   MESSAGE
========================= */

.message {

    max-width: 550px;

    margin: auto;

    font-size:
        clamp(16px, 4vw, 21px);

    line-height: 1.9;

    color:
        rgba(255,255,255,.86);
}


/* =========================
   FOOTER TEXT
========================= */

.footer {

    margin-top: 28px;

    font-size: 12px;

    letter-spacing: 4px;

    opacity: .55;
}


/* =========================
   FLOATING PARTICLES
========================= */

.float {

    position: fixed;

    bottom: -30px;

    z-index: 5;

    pointer-events: none;

    opacity: 0;

    animation:
        floatUp
        var(--duration)
        linear infinite;

    animation-delay:
        var(--delay);
}

@keyframes floatUp {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    15% {
        opacity: .5;
    }

    80% {
        opacity: .25;
    }

    100% {

        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .moon {

        width: 82px;
        height: 82px;

        top: 7%;
        right: 8%;
    }

    .moon::after {

        width: 82px;
        height: 82px;
    }

    .card {

        padding:
            40px 20px;

        border-radius: 25px;
    }

    .moon-icon {
        font-size: 48px;
    }

    .title {
        letter-spacing: 2px;
    }

    .message {
        line-height: 1.75;
    }

    .footer {
        letter-spacing: 2px;
    }
}

</style>
</head>


<body>


<!-- =========================
     STARS
========================= -->

<div id="stars"></div>


<!-- =========================
     SHOOTING STARS
========================= -->

<div
    class="shooting-star"
    style="
        top:18%;
        left:85%;
        animation-delay:2s;
    ">
</div>

<div
    class="shooting-star"
    style="
        top:35%;
        left:70%;
        animation-delay:8s;
    ">
</div>

<div
    class="shooting-star"
    style="
        top:12%;
        left:55%;
        animation-delay:14s;
    ">
</div>


<!-- =========================
     MOON
========================= -->

<div class="moon"></div>


<!-- =========================
     CLOUDS
========================= -->

<div class="cloud one"></div>
<div class="cloud two"></div>


<!-- =========================
     MAIN CONTENT
========================= -->

<main class="container">

    <section class="card">

        <div class="moon-icon">
            🌙
        </div>

        <h1 class="title">
            Good Night
        </h1>

        <div class="divider"></div>

        <p class="message">

            May the quiet of the night
            bring peace to your mind,
            warmth to your heart,
            and beautiful dreams
            to your sleep.

            <br><br>

            Leave today behind
            and let tomorrow begin
            with a fresh start.

        </p>

        <p class="footer">

            SLEEP WELL • DREAM BEAUTIFULLY

        </p>

    </section>

</main>


<!-- =========================
     MUSIC
========================= -->

<audio
    id="music"
    loop
    preload="auto">

    <source
        src="music.mp3"
        type="audio/mpeg">

</audio>


<script>

/* =========================
   GENERATE STARS
========================= */

const starsContainer =
    document.getElementById("stars");


for (let i = 0; i < 180; i++) {

    const star =
        document.createElement("div");

    star.className =
        "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";


    const size =
        Math.random() * 3 + 1;


    star.style.width =
        size + "px";

    star.style.height =
        size + "px";


    star.style.setProperty(
        "--time",
        (Math.random() * 3 + 2) + "s"
    );


    star.style.setProperty(
        "--delay",
        Math.random() * 5 + "s"
    );


    starsContainer.appendChild(star);
}


/* =========================
   FLOATING SYMBOLS
========================= */

const symbols = [
    "✦",
    "✧",
    "⋆",
    "♡"
];


for (let i = 0; i < 25; i++) {

    const particle =
        document.createElement("div");

    particle.className =
        "float";


    particle.textContent =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    particle.style.left =
        Math.random() * 100 + "%";


    particle.style.fontSize =
        (Math.random() * 12 + 10)
        + "px";


    particle.style.setProperty(
        "--duration",
        (Math.random() * 10 + 8) + "s"
    );


    particle.style.setProperty(
        "--delay",
        Math.random() * 10 + "s"
    );


    document.body.appendChild(
        particle
    );
}


/* =========================
   MUSIC
========================= */

const music =
    document.getElementById("music");

music.volume = 0.35;


/*
   Try autoplay.
*/

window.addEventListener(
    "load",
    function () {

        music.play()
            .catch(function () {

                console.log(
                    "Browser blocked autoplay."
                );

            });

    }
);


/*
   Mobile browsers often require
   the user to tap first.

   Any tap starts the music.
*/

function startMusic() {

    music.play()
        .catch(function () {});

}


document.addEventListener(
    "click",
    startMusic,
    { once: true }
);


document.addEventListener(
    "touchstart",
    startMusic,
    { once: true }
);

</script>

</body>
</html>
